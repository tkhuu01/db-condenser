[project]
name = "db-condenser"
description = "Config-driven database subsetting tool that creates representative samples while preserving referential integrity. Modernized fork of Tonic's Condenser with performance and feature improvements."
authors = [{ name = "Thomas Khuu" }]
license = "MIT"
license-files = ["LICENSE"]
version = "1.7.1"
readme = "README.md"
classifiers = [
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
keywords = [
    "database",
    "subset",
    "postgresql",
    "sampling",
    "data",
    "migration",
    "testing",
]
dependencies = [
    "faker>=38.2.0,<39",
    "mysql-connector-python>=9.5.0,<10",
    "psycopg[binary]>=3.2,<4",
    "toposort==1.10",
]

[project.urls]
Repository = "https://github.com/tkhuu01/db-condenser"

[project.scripts]
subset = "db_condenser.direct_subset:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.15.11",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "unit: database-free tests (pytest -m unit)",
    "integration: tests requiring a disposable database service",
    "postgres: PostgreSQL integration tests",
    "mysql: MySQL integration tests (set MYSQL_HOST to opt in)",
    "performance: opt-in measurements (--run-performance)",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src/db_condenser", "CONFIG.md", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/db_condenser"]

[tool.hatch.build.targets.wheel.force-include]
"CONFIG.md" = "db_condenser/CONFIG.md"
