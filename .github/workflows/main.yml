name: Main CI
on: push
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ruff Format
        uses: astral-sh/ruff-action@v3.5.1
        with:
          args: 'format --check'
      - name: Ruff Format Import
        uses: astral-sh/ruff-action@v3.5.1
        with:
          args: 'check --select I'
      - name: Ruff Lint
        uses: astral-sh/ruff-action@v3.5.1

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py
      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres-version: [14, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Copy matching PostgreSQL client tools from service container
        run: |
          PG_VERSION=${{ matrix.postgres-version }}
          PG_CONTAINER=$(docker ps -q -f "ancestor=postgres:$PG_VERSION")
          docker cp "$PG_CONTAINER":/usr/lib/postgresql/$PG_VERSION/bin/pg_dump /usr/local/bin/pg_dump
          docker cp "$PG_CONTAINER":/usr/lib/postgresql/$PG_VERSION/bin/pg_restore /usr/local/bin/pg_restore
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest tests/ -v
