name: Main CI
on: push
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ruff Format
        uses: astral-sh/ruff-action@v3.5.1
        with:
          args: 'format --check'
      - name: Ruff Format Import
        uses: astral-sh/ruff-action@v3.5.1
        with:
          args: 'check --select I'
      - name: Ruff Lint
        uses: astral-sh/ruff-action@v3.5.1

  postgres-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres-version: [14, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Copy matching PostgreSQL client tools from service container
        run: |
          PG_VERSION=${{ matrix.postgres-version }}
          PG_CONTAINER=$(docker ps -q -f "ancestor=postgres:$PG_VERSION")
          docker cp "$PG_CONTAINER":/usr/lib/postgresql/$PG_VERSION/bin/pg_dump /usr/local/bin/pg_dump
          docker cp "$PG_CONTAINER":/usr/lib/postgresql/$PG_VERSION/bin/pg_restore /usr/local/bin/pg_restore
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest tests/psql -v

  mysql-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Copy matching MySQL client tools from service container
        run: |
          MYSQL_CONTAINER=$(docker ps -q -f "ancestor=mysql:8.4")
          docker cp "$MYSQL_CONTAINER":/usr/bin/mysql /usr/local/bin/mysql
          docker cp "$MYSQL_CONTAINER":/usr/bin/mysqldump /usr/local/bin/mysqldump
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest tests/mysql -v
        env:
          MYSQL_PATH: /usr/local/bin
